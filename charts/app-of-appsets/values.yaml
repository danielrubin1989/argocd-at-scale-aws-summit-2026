# Repository containing singlidation structure
repoURL: https://github.com/danielrubin1989/argocd-at-scale-aws-summit-2026.git

# Namespaces to create ApplicationSets for
applicationSets:
  - devops
  - kube-system
  - kyverno

# Cluster name (used for values file discovery)
clusterName: c1-cluster

# Custom generator plugin name (must match ArgoCD ConfigMap)
generatorPlugin: infra-deployment-generator

# How often the plugin is re-polled (default ArgoCD is 30 minutes — too slow for a live demo)
pluginRequeueAfterSeconds: 30

# ArgoCD project
project: default

# Sync policy
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions: [CreateNamespace=true]
